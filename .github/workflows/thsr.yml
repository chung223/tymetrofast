name: 更新高鐵時刻／餘票／警示

# 自 fids.yml 拆出：餘票需逐站查詢（12 站 × 1 次），是全站最耗 TDX 點數的來源。
# 餘票不會半小時就翻盤，改為營運時段每 2 小時更新；深夜不跑。
on:
  schedule:
    - cron: "0 22,0,2,4,6,8,10,12,14 * * *"  # 台北 06/08/10/12/14/16/18/20/22 時
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  thsr-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      # 排程產生、不進版控的資料：先抓回線上版，避免某一步失敗時部署把它洗掉
      - name: 保留線上動態資料
        run: |
          for f in fids.json fids-future.json thsr-stations.json thsr-timetable.json thsr-fares.json thsr-live.json alerts.json trtc.json trtc-fares.json; do
            curl -sf "https://chung223.github.io/tymetrofast/data/$f" -o "data/$f" || true
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 抓取高鐵時刻／票價／餘票／警示
        continue-on-error: true   # 額度用罄時保留線上既有資料，不讓排程整條紅
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: node scripts/fetch-thsr.mjs

      - name: 組裝網站
        run: |
          mkdir -p _site/data
          cp index.html hub.html manifest.webmanifest sw.js _site/
          cp -r assets icons _site/
          cp data/*.json _site/data/
          node scripts/build-share-pages.mjs _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
