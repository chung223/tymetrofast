name: 更新台北捷運資料

on:
  workflow_dispatch:
  schedule:
    # 每週日 05:30（台灣時間）；北捷為班距制，全部資料屬靜態，週更足矣
    - cron: "30 21 * * 6"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  trtc-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      # 排程產生、不進版控的資料：先抓回線上版，避免部署洗掉
      - name: 保留線上動態資料
        run: |
          for f in fids.json fids-future.json thsr-stations.json thsr-timetable.json thsr-fares.json thsr-live.json alerts.json trtc.json trtc-fares.json; do
            curl -sf "https://chung223.github.io/tymetrofast/data/$f" -o "data/$f" || true
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 抓取台北捷運靜態資料
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: node scripts/fetch-trtc.mjs

      - name: 組裝網站
        run: |
          mkdir -p _site/data
          cp index.html hub.html manifest.webmanifest sw.js _site/
          cp -r assets icons _site/
          cp data/*.json _site/data/
          node scripts/build-share-pages.mjs _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
