name: 更新機場航班看板與高鐵動態

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fids-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 抓取 TDX FIDS 看板
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: node scripts/fetch-fids.mjs

      - name: 抓取高鐵時刻／票價／餘票／警示
        continue-on-error: true
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: node scripts/fetch-thsr.mjs

      - name: 組裝網站
        run: |
          mkdir -p _site/data
          cp index.html hub.html manifest.webmanifest sw.js _site/
          cp -r assets icons _site/
          cp data/*.json _site/data/
          node scripts/build-share-pages.mjs _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
