name: 更新官方時刻表（TDX）

on:
  workflow_dispatch:
  schedule:
    # 每週六 05:00（台灣時間）自動檢查官方班表是否異動
    - cron: "0 21 * * 5"
  push:
    branches: ["claude/**"]
    paths: ["data/raw/.fetch-request"]

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: update-timetable
  cancel-in-progress: false

jobs:
  fetch-convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 抓取桃捷官網時刻表頁面（主要資料源，平日＋假日）
        continue-on-error: true
        run: bash scripts/fetch-official-site.sh

      - name: 抓取 TDX 原始資料（備援；無金鑰時僅警告）
        continue-on-error: true
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: node scripts/fetch-tdx.mjs

      - name: 提交原始資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/raw
          git diff --cached --quiet || git commit -m "chore: 更新官方時刻表原始資料"
          git push

      - name: 串連成逐班車時刻並驗證
        run: |
          cp data/timetable.json /tmp/timetable-old.json
          # TDX 優先：它直接給 StoppingPatternID（停站型態）與平日/假日標記，
          # 始發站與停站型態不必用時刻推測。官網 HTML 逐站標記不一致，只當備援。
          # 實例：平日 07:15／07:30／08:15／09:15 由環北始發的北上直達車，
          # 只有 TDX 有；官網頁面把它們漏成第二航廈始發。
          if [ -f data/raw/tdx/StationTimeTable.json ]; then
            node scripts/tdx-to-timetable.mjs
          elif [ -d data/raw/official/weekday ] && [ -d data/raw/official/holiday ]; then
            node scripts/official-to-timetable.mjs
          else
            echo "::warning::官網與 TDX 皆無資料，未更新時刻表"
            exit 0
          fi
          node scripts/test-planner.mjs
          git add data/timetable.json
          git diff --cached --quiet || git commit -m "chore: 依官方資料更新時刻表"
          git push

      - name: 更新加值資料（票價／高鐵接駁）
        continue-on-error: true
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: |
          node scripts/fetch-extras.mjs
          node scripts/build-extras.mjs
          git add data/fares.json data/hsr-a18.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: 更新票價與高鐵接駁資料"
          git push

      # 改點時自動開 Issue 摘要差異，方便追蹤與抽查
      - name: 改點偵測開 Issue
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f /tmp/timetable-old.json ] || exit 0
          node scripts/diff-timetable.mjs /tmp/timetable-old.json data/timetable.json > /tmp/tt-diff.md
          if [ -s /tmp/tt-diff.md ]; then
            title="🚇 時刻表改點：$(node -p "require('./data/timetable.json').version")"
            existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' || true)
            if [ -z "$existing" ]; then
              gh issue create --title "$title" --body-file /tmp/tt-diff.md
            fi
          fi

      # GITHUB_TOKEN 的 push 不會觸發其他 workflow，須主動觸發部署
      - name: 觸發網站重新部署
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
