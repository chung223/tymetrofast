name: 部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 與排程資料更新共用群組：改為排隊而非取消，避免掐掉進行中的資料抓取
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 排程產生、不進版控的資料：部署前抓回線上版避免被洗掉
      - name: 保留線上動態資料
        id: keep
        run: |
          risky=""
          for f in fids.json fids-future.json thsr-stations.json thsr-timetable.json thsr-fares.json thsr-live.json alerts.json trtc.json trtc-fares.json; do
            code=$(curl -s --retry 3 --retry-delay 2 --retry-all-errors -o "data/$f.tmp" \
              -w '%{http_code}' "https://chung223.github.io/tymetrofast/data/$f" || echo 000)
            if [ "$code" = "200" ]; then mv "data/$f.tmp" "data/$f"; continue; fi
            rm -f "data/$f.tmp"
            # 404 代表線上本來就沒有；其他狀態代表「有、只是這次沒拿到」，不能讓部署洗掉
            [ "$code" = "404" ] || risky="$risky $f"
            echo "::warning::取回線上 data/$f 失敗（HTTP $code）"
          done
          echo "risky=$risky" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # patterns.json 有改時同步展開班表（若 timetable.json 已是 TDX 官方資料則不覆蓋）
      - name: 重建時刻表
        run: node scripts/build-timetable.mjs --if-estimate

      - name: 轉乘引擎測試
        run: node scripts/test-planner.mjs

      - name: 組裝網站
        run: |
          mkdir -p _site/data
          cp index.html hub.html manifest.webmanifest sw.js _site/
          cp -r assets icons _site/
          cp data/*.json _site/data/
          node scripts/build-share-pages.mjs _site

      # 只在部署流程跑（FIDS 每 30 分排程不跑，節省額度）
      - name: 煙霧測試（Playwright 實際渲染主要功能）
        run: |
          npm i --no-save playwright > /dev/null
          npx playwright install --with-deps chromium
          node scripts/smoke.mjs _site

      - name: 上傳煙霧測試截圖（視覺回歸參考）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-shots/
          retention-days: 14
          if-no-files-found: ignore

      # 線上有、這次卻沒取回，本輪也沒重新產生 → 部署等於永久刪檔，寧可整輪不部署
      - name: 確認不會洗掉線上資料
        id: guard
        run: |
          echo "本輪 _site/data：$(ls _site/data | tr '\n' ' ')"
          lost=""
          for f in ${{ steps.keep.outputs.risky }}; do [ -s "_site/data/$f" ] || lost="$lost $f"; done
          if [ -n "$lost" ]; then
            echo "::warning::缺少$lost，跳過本輪部署以保留線上既有資料"
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5
        if: steps.guard.outputs.ok == '1'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.ok == '1'
        with:
          path: _site

      - id: deployment
        if: steps.guard.outputs.ok == '1'
        uses: actions/deploy-pages@v4
