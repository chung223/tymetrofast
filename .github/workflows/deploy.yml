name: 部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # patterns.json 有改時同步展開班表（若 timetable.json 已是 TDX 官方資料則不覆蓋）
      - name: 重建時刻表
        run: node scripts/build-timetable.mjs --if-estimate

      - name: 轉乘引擎測試
        run: node scripts/test-planner.mjs

      - name: 組裝網站
        run: |
          mkdir -p _site/data
          cp index.html manifest.webmanifest sw.js _site/
          cp -r assets icons _site/
          cp data/*.json _site/data/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
