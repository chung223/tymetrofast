name: 部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 排程產生、不進版控的資料：部署前抓回線上版避免被洗掉
      - name: 保留線上動態資料
        run: |
          for f in fids.json fids-future.json thsr-stations.json thsr-timetable.json thsr-fares.json thsr-live.json alerts.json; do
            curl -sf "https://chung223.github.io/tymetrofast/data/$f" -o "data/$f" || true
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # patterns.json 有改時同步展開班表（若 timetable.json 已是 TDX 官方資料則不覆蓋）
      - name: 重建時刻表
        run: node scripts/build-timetable.mjs --if-estimate

      - name: 轉乘引擎測試
        run: node scripts/test-planner.mjs

      - name: 組裝網站
        run: |
          mkdir -p _site/data
          cp index.html hub.html manifest.webmanifest sw.js _site/
          cp -r assets icons _site/
          cp data/*.json _site/data/
          node scripts/build-share-pages.mjs _site

      # 只在部署流程跑（FIDS 每 30 分排程不跑，節省額度）
      - name: 煙霧測試（Playwright 實際渲染主要功能）
        run: |
          npm i --no-save playwright > /dev/null
          npx playwright install --with-deps chromium
          node scripts/smoke.mjs _site

      - name: 上傳煙霧測試截圖（視覺回歸參考）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-shots/
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
