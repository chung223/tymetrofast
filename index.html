<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c111c">
<meta name="description" content="桃園機場捷運快速轉乘計算器：比較直達車＋轉乘與普通車直達，依出發時間找出最快搭法。">
<title>機捷快轉｜桃園機場捷運快速轉乘計算器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%238E4E9E'/%3E%3Ctext x='50' y='68' font-size='52' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='white'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=DotGothic16&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="station-sign">
  <div class="sign-inner">
    <span class="line-roundel" aria-hidden="true">A</span>
    <div class="sign-title">
      <h1>機捷快轉</h1>
      <p class="sign-sub">TAOYUAN AIRPORT MRT · FAST TRANSFER PLANNER</p>
    </div>
    <span class="clock" id="clock" aria-label="台灣時間">--:--</span>
  </div>
  <div class="sign-stripe" aria-hidden="true"></div>
</header>

<main>
  <!-- 查詢面板 -->
  <section class="panel query-panel" aria-label="行程查詢">
    <div class="od-row">
      <button class="station-btn" id="btn-from" aria-haspopup="dialog">
        <span class="od-label">出發</span>
        <span class="station-chip"><span class="code" id="from-code">A1</span><span class="stn-name" id="from-name">台北車站</span></span>
      </button>
      <button class="swap-btn" id="btn-swap" title="交換起訖" aria-label="交換起訖">⇅</button>
      <button class="station-btn" id="btn-to" aria-haspopup="dialog">
        <span class="od-label">前往</span>
        <span class="station-chip"><span class="code" id="to-code">A16</span><span class="stn-name" id="to-name">橫山</span></span>
      </button>
    </div>

    <div class="time-row">
      <div class="seg-control" role="tablist" aria-label="出發時間模式">
        <button class="seg on" id="mode-now" role="tab" aria-selected="true">現在出發</button>
        <button class="seg" id="mode-custom" role="tab" aria-selected="false">指定時間</button>
      </div>
      <input type="datetime-local" id="custom-time" class="dt-input" hidden>
      <span class="daytype-chip" id="daytype-chip">平日班表</span>
    </div>
  </section>

  <!-- 全線路線圖 -->
  <section class="panel map-panel" aria-label="路線圖">
    <div class="line-map-scroll">
      <svg id="line-map" class="line-map" role="img" aria-label="機場線路線圖與本次行程"></svg>
    </div>
    <p class="map-hint"><span class="dot-demo express"></span>直達車停靠　<span class="dot-demo"></span>普通車各站停靠</p>
  </section>

  <!-- 月台警示帶 -->
  <div class="platform-strip" aria-hidden="true"></div>

  <!-- 查詢結果 -->
  <section id="results" aria-live="polite"></section>

  <p class="disclaimer" id="data-note"></p>
</main>

<footer class="site-footer">
  <p>非官方工具，時刻為推算值，實際以
    <a href="https://www.tymetro.com.tw/tymetro-new/tw/_pages/travel-guide/timetable.html" target="_blank" rel="noopener">桃園捷運官方時刻表</a>為準。
  </p>
  <p><a id="repo-link" href="https://github.com/chung223/tymetrofast" target="_blank" rel="noopener">GitHub</a> · 改點時更新 repo 內 <code>data/</code> 後自動重新部署</p>
</footer>

<!-- 選站底部面板 -->
<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<div class="sheet" id="station-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-handle" aria-hidden="true"></div>
  <h2 id="sheet-title">選擇車站</h2>
  <ol class="station-list" id="station-list"></ol>
</div>

<script type="module" src="assets/app.js"></script>
</body>
</html>
