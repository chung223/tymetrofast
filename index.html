<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#120f0a">
<meta name="description" content="桃園機場捷運快速轉乘計算器：比較直達車＋轉乘與普通車直達，依出發或抵達時間找出最快搭法。">
<title>機捷快轉｜桃園機場捷運快速轉乘計算器</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Serif+TC:wght@700;900&family=DotGothic16&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="station-sign">
  <div class="sign-inner">
    <span class="line-roundel" aria-hidden="true">A</span>
    <div class="sign-title">
      <h1>機捷快轉</h1>
      <p class="sign-sub">TAOYUAN AIRPORT MRT · FAST TRANSFER PLANNER</p>
    </div>
    <button id="theme-btn" class="theme-btn" title="深淺模式" aria-label="深淺模式">◐</button>
    <select id="lang-sel" class="lang-sel" aria-label="Language">
      <option value="zh">中</option><option value="en">EN</option><option value="ja">日</option><option value="ko">한</option>
    </select>
    <span class="clock" id="clock" aria-label="台灣時間">--:--</span>
  </div>
  <div class="sign-stripe" aria-hidden="true"></div>
</header>

<main>
  <nav class="view-tabs" role="tablist">
    <button class="vtab on" id="tab-plan" role="tab">路線查詢</button>
    <button class="vtab" id="tab-board" role="tab">車站看板</button>
    <button class="vtab" id="tab-flight" role="tab">✈ 航班</button>
    <button class="vtab" id="tab-hsr" role="tab">🚄 高鐵</button>
  </nav>

  <div id="plan-wrap">
    <!-- 查詢面板 -->
    <section class="panel query-panel" aria-label="行程查詢">
      <div class="od-row">
        <button class="station-btn" id="btn-from" aria-haspopup="dialog">
          <span class="od-label" id="od-label-from">出發</span>
          <span class="station-chip"><span class="code" id="from-code">A1</span><span class="stn-name" id="from-name">台北車站</span></span>
        </button>
        <button class="swap-btn" id="btn-swap" title="⇅" aria-label="⇅">⇅</button>
        <button class="station-btn" id="btn-to" aria-haspopup="dialog">
          <span class="od-label" id="od-label-to">前往</span>
          <span class="station-chip"><span class="code" id="to-code">A16</span><span class="stn-name" id="to-name">橫山</span></span>
        </button>
      </div>

      <div class="time-row">
        <div class="seg-control" role="tablist" aria-label="時間模式">
          <button class="seg on" id="mode-now" role="tab" aria-selected="true">現在出發</button>
          <button class="seg" id="mode-depart" role="tab" aria-selected="false">指定出發</button>
          <button class="seg arrive" id="mode-arrive" role="tab" aria-selected="false">指定抵達</button>
        </div>
        <input type="datetime-local" id="custom-time" class="dt-input" hidden>
        <span class="daytype-chip" id="daytype-chip">平日班表</span>
      </div>

      <div class="fav-block">
        <span class="fav-label" id="fav-title">常用路線</span>
        <div class="fav-row" id="fav-row"></div>
      </div>
    </section>

    <!-- 路線圖 -->
    <section class="panel map-panel" aria-label="路線圖">
      <button class="map-toggle" id="map-toggle">地圖</button>
      <div class="line-map-scroll">
        <svg id="line-map" class="line-map" role="img" aria-label="機場線路線圖與本次行程"></svg>
      </div>
      <p class="map-hint" id="map-hint-text"></p>
    </section>

    <!-- 月台警示帶 -->
    <div class="platform-strip" aria-hidden="true"></div>

    <!-- 查詢結果 -->
    <section id="results" aria-live="polite"></section>
  </div>

  <div id="board-wrap" hidden>
    <section class="panel board-panel">
      <button class="station-btn board-pick" id="btn-board-station" aria-haspopup="dialog">
        <span class="od-label" id="board-title">即將發車</span>
        <span class="station-chip"><span class="code" id="board-code">A1</span><span class="stn-name" id="board-name">台北車站</span></span>
      </button>
      <div class="firstlast" id="board-firstlast"></div>
      <ol class="board-list" id="board-list"></ol>
    </section>
  </div>

  <div id="flight-wrap" hidden>
    <section class="panel flight-panel">
      <details class="wx-card" id="wx-details" hidden>
        <summary class="wx-strip" id="wx-strip"></summary>
        <div class="wx-body" id="wx-body"></div>
      </details>
      <div class="seg-control fl-dir" role="tablist">
        <button class="seg on" id="fl-dir-dep" role="tab">出發</button>
        <button class="seg" id="fl-dir-arr" role="tab">抵達</button>
      </div>
      <input type="search" id="flight-search" class="dt-input flight-search" placeholder="搜尋航班號或目的地">
      <ol class="flight-list" id="flight-list"></ol>
      <p class="map-hint" id="fids-note"></p>
    </section>
  </div>

  <div id="hsr-wrap" hidden>
    <section class="panel flight-panel">
      <div class="seg-control fl-dir" role="tablist">
        <button class="seg on" id="hsr-dir-n" role="tab">北上</button>
        <button class="seg" id="hsr-dir-s" role="tab">南下</button>
      </div>
      <ol class="flight-list" id="hsr-list"></ol>
      <p class="map-hint" id="hsr-note"></p>
    </section>
  </div>

  <p class="disclaimer" id="data-note"></p>
</main>

<footer class="site-footer">
  <p>非官方工具，時刻僅供參考，實際以
    <a href="https://www.tymetro.com.tw/tymetro-new/tw/_pages/travel-guide/timetable.html" target="_blank" rel="noopener">桃園捷運官方時刻表</a>為準。
  </p>
  <p><a href="https://github.com/chung223/tymetrofast" target="_blank" rel="noopener">GitHub</a> · 改點時更新 repo 內 <code>data/</code> 後自動重新部署
    · 姊妹站 <a href="https://chung223.github.io/as-jx/" target="_blank" rel="noopener">✈ 哩程玩家工具箱</a>
    · <a href="https://chung223.github.io/" target="_blank" rel="noopener">旅人工具箱</a></p>
</footer>

<!-- 選站底部面板 -->
<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<div class="sheet" id="station-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-handle" aria-hidden="true"></div>
  <h2 id="sheet-title">選擇車站</h2>
  <ol class="station-list" id="station-list"></ol>
</div>

<script type="module" src="assets/app.js"></script>
</body>
</html>
